# Zehra OS - Hyprland Configuration
# Clean initial Hyprland boot configuration for Celestia Shell

# ============================================
# MONITOR CONFIGURATION
# ============================================
monitor=,preferred,auto,auto

# ============================================
# EXECUTE ON STARTUP
# ============================================
# Start Celestia Shell desktop manager automatically
exec-once = caelestia shell -d

# Additional autostart applications
exec-once = pipewire & wireplumber &
exec-once = swww-daemon &
exec-once = hypridle &
# Use ryoku-orbital-clock-lockscreen as the lockscreen
exec-once = ryoku-orbital-clock-lockscreen &

# ============================================
# INPUT CONFIGURATION
# ============================================
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        drag_lock = no
        disable_while_typing = yes
    }
    sensitivity = 0
}

# ============================================
# GENERAL SETTINGS
# ============================================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89a6b3ff) rgba(5e81acff) 45deg
    col.inactive_border = rgba(3b4252ff)
    layout = dwindle
    allow_tearing = no
    animate_manual_resizes = yes
    enable_swallow = yes
    swallow_regex = ^(kitty|alacritty|foot)$
}

# ============================================
# DECORATION & BLUR
# ============================================
decoration {
    rounding = 10
    blur {
        enabled = yes
        size = 8
        passes = 3
        new_optimizations = yes
        vibrancy = 0.1667
        contrast = 1.0
        brightness = 1.0
        special = yes
    }
    drop_shadow = yes
    shadow_range = 12
    shadow_render_power = 3
    col.shadow = rgba(1a1a2eff)
}

# ============================================
# ANIMATIONS
# ============================================
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ============================================
# WINDOW RULES
# ============================================
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, title:^(Open File|Save As|Print)$
windowrulev2 = size 800 600, class:^(pavucontrol|blueman-manager)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager|nm-connection-editor)$

# ============================================
# KEYBINDINGS
# ============================================
$mainMod = SUPER

# Terminal
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, kitty -e fish

# Application launcher
bind = $mainMod, Space, exec, wofi --show drun

# Close window
bind = $mainMod SHIFT, Q, killactive

# Reload config
bind = $mainMod SHIFT, R, reload

# Exit Hyprland
bind = $mainMod SHIFT, E, exit

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window switching - Super+Tab for fluid app switching
bind = $mainMod, Tab, cyclenext
bind = $mainMod SHIFT, Tab, cyclenext, prev

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Fullscreen
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1

# Pseudo (dwindle master)
bind = $mainMod, P, pseudo

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Lockscreen
bind = $mainMod SHIFT, L, exec, ryoku-orbital-clock-lockscreen

# Volume/Audio
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ============================================
# CURSOR
# ============================================
cursor {
    theme = Bibata-Modern-Ice
    size = 24
}

# ============================================
# MISC
# ============================================
misc {
    force_default_wallpaper = -1
    check_updates = yes
    disable_hyprland_logo = yes
    vrr = 1
    mouse_move_enables_dpms = yes
    key_press_enables_dpms = yes
    enable_swallow = yes
}